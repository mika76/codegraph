name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows only for now: the tool and its tests assume Windows paths; Linux has not been tried yet
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test CodeGraph.slnx -c Release
